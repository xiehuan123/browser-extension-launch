<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常用语小抄</title>
  <link rel="stylesheet" href="popup.css">
  <script src="core.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header><img src="icons/icon-48.png" width="36" height="36" alt=""><div><h1>常用语小抄</h1><p>常说的话，存好就不用重打。</p></div></header>
    <form id="snippet-form">
      <label for="snippet-title">标题</label>
      <input id="snippet-title" maxlength="80" placeholder="例如：收件提醒" required disabled>
      <label for="snippet-text">正文 <span>最多 5000 字</span></label>
      <textarea id="snippet-text" maxlength="5000" rows="3" placeholder="输入或粘贴经常要用的一段话……" required disabled></textarea>
      <button class="primary" id="save-button" type="submit" disabled>保存小抄</button>
    </form>
    <div class="feedback"><p id="status" role="status" aria-live="polite" aria-atomic="true">正在读取小抄……</p><button id="retry-button" type="button" hidden>重新读取</button></div>
    <section aria-labelledby="saved-heading">
      <div class="section-heading"><h2 id="saved-heading">我的小抄</h2><span id="count">0 / 200 条</span></div>
      <label class="search-label" for="search-input">搜索标题或正文</label>
      <input id="search-input" type="search" placeholder="输入关键词" disabled>
      <p class="empty" id="empty-state" hidden>还没有小抄。<br>先保存第一条常用回复吧。</p>
      <ul id="snippet-list"></ul>
    </section>
    <footer>只保存在当前浏览器，不读取网页、不上传。<br>复制后，可到需要的地方自行粘贴。<br>卸载插件或清除插件数据后，小抄会丢失。</footer>
  </main>
</body>
</html>
