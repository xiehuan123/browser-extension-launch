<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>标签页收纳</title>
  <link rel="stylesheet" href="popup.css">
  <script src="core.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header><img src="icons/icon-48.png" width="36" height="36" alt=""><div><h1>标签页收纳</h1><p>把这一组网页，留到下次继续。</p></div></header>
    <form id="session-form">
      <label for="session-name">这组网页叫什么？</label>
      <input id="session-name" maxlength="60" placeholder="例如：周末旅行攻略" required disabled>
      <button class="primary" id="save-button" type="submit" disabled>保存当前窗口的网页</button>
    </form>
    <p class="hint">只保存普通网页；新标签页、设置页和本地文件会跳过。最多 30 份清单，每份 200 个网页。</p>
    <div class="feedback"><p id="status" role="status" aria-live="polite" aria-atomic="true">正在读取清单……</p><button id="retry-button" type="button" hidden>重新读取</button></div>
    <section aria-labelledby="saved-heading">
      <div class="section-heading"><h2 id="saved-heading">已收纳</h2><span id="count">0 份</span></div>
      <p class="empty" id="empty-state" hidden>还没有清单。<br>先打开几个网页，再保存到这里。</p>
      <ul id="session-list"></ul>
    </section>
    <footer>标题和网址只存当前浏览器，不上传。<br>恢复会新增标签页；网页内容、登录状态和填写内容不会保存。<br>卸载插件或清除插件数据后，清单会丢失。</footer>
  </main>
</body>
</html>
