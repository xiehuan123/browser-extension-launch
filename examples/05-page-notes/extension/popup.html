<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页便签</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">给这页留句话</span>
      <h1>网页便签</h1>
      <p class="intro">下次打开同一网址，接着看你的想法。</p>
    </header>
    <section class="page" aria-label="当前网页">
      <h2 id="page-title">正在读取当前网页…</h2>
      <p id="page-url"></p>
    </section>
    <form id="note-form">
      <label for="note">这页的便签</label>
      <textarea id="note" rows="8" maxlength="10000" placeholder="例如：这篇文章第三部分值得再读。" readonly aria-describedby="note-hint count"></textarea>
      <div class="note-meta">
        <span id="note-hint">写好后点“保存便签”</span>
        <span id="count">0 / 10000</span>
      </div>
      <div class="actions">
        <button id="save" type="submit" disabled>保存便签</button>
        <button id="clear" type="button" class="secondary" disabled>清空输入</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite">正在准备…</p>
    <button id="delete" type="button" class="delete" disabled>删除本页便签</button>
    <footer>便签、网址和标题留在这台电脑的当前浏览器，不会上传。卸载插件会删除这些记录。</footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
